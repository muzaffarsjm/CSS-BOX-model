<!DOCTYPE html>
<html>
  <head>
    <title>BOX model</title>
    <link rel="stylesheet" href="boxmodel.css">
  </head>
  <body>
    <h1>CSS Boxes</h1>

    <div class="first-box">
      <p>Pagination</p>
      <button class="special-buttons">Back</button>
        <button class="middle-buttons">1</button>
        <button class="middle-buttons">2</button>
        <button class="middle-buttons">3</button>
        <button class="middle-buttons">4</button>
        <button class="middle-buttons">5</button>
      <button class="special-buttons">Next</button>
    </div>
    <div class="second-box">
      <p>A stretching button</p>
      <button class="stretch-button">Stretch</button>
    </div>
    <div class="stretch-button-container">
      <p>3D Click button(Click on it to see the change)</p>
      <button class="shadow-button">Shadow</button>
    </div>
    <div>
      <p>Margin and padding together</p>
      <button class="last-buttons">One</button>
      <button class="last-buttons">Two</button>
      <button class="last-buttons">Three</button>
    </div>
  </body>
</html>
